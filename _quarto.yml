project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!cv-pdf.qmd"
  resources:
    - files/CV_Nesslage.pdf
    - imgs/web/contours.svg
    - imgs/web/bg-about.jpg

website:
  title: "Jacob Nesslage, Ph.D."
  description: "Postdoctoral Scholar"
  site-url: https://jollygoodjacob.github.io
  favicon: imgs/web/favicon.png
  navbar:
    left:
      - text: "Research"
        href: projects.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Interactive Map"
        href: map.qmd
      - text: "Curriculum Vitae"
        href: cv.qmd
  page-footer:
    left: "© 2026, Jacob Nesslage"
    right: Built using [GitHub](https://github.com/jollygoodjacob), [R](https://www.r-project.org/), and [Quarto](https://quarto.org/).

format:
  html:
    theme: [cyborg, theme.scss]
    css: styles.css
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    link-external-newwindow: true

editor: visual
